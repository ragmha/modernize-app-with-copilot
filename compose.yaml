name: photoalbum-lab

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:97b448857967be55e005424a660056fe6d51814435804dc07e8f79f028bab5fb
    platform: linux/amd64
    environment:
      ACCEPT_EULA: ${ACCEPT_SQLSERVER_EULA:-N}
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD:?Run npm run lab -- setup first}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    mem_limit: 3g

  oracle:
    image: gvenzl/oracle-free:23-slim-faststart@sha256:d86d09794ae138a8951e97d7ee010778dcd43088e8d0f83a51002abab8c6d7fd
    platform: linux/amd64
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Run npm run lab -- setup first}
      APP_USER: photoalbum
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?Run npm run lab -- setup first}
    ports:
      - "127.0.0.1:1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 180s
    mem_limit: 4g

  postgres:
    image: postgres:17@sha256:d13db94ae661d517c5ed57c509a578d5ea64aae639871ba25294f4f42d83de28
    platform: linux/amd64
    environment:
      POSTGRES_DB: photoalbum
      POSTGRES_USER: photoalbum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run lab -- setup first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photoalbum -d photoalbum"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  sql-data:
  oracle-data:
  postgres-data:
