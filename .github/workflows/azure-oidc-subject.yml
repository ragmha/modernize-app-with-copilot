name: Inspect Azure OIDC subject

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claims:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: azure
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Show only the actual issuer, audience and subject; never the token
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const environment = await github.rest.repos.getEnvironment({ ...context.repo, environment_name: "azure" });
            const policies = await github.paginate(github.rest.repos.listDeploymentBranchPolicies, { ...context.repo, environment_name: "azure", per_page: 100 });
            const review = environment.data.protection_rules?.find(rule => rule.type === "required_reviewers");
            if (!review?.reviewers?.length || environment.data.deployment_branch_policy?.custom_branch_policies !== true ||
                policies.length !== 1 || policies[0].name !== context.payload.repository.default_branch || policies[0].type !== "branch") {
              throw new Error("Configure azure required reviewers and an exact default-branch deployment rule before requesting an OIDC token.");
            }
            const token = await core.getIDToken("api://AzureADTokenExchange");
            core.setSecret(token);
            const { iss, aud, sub } = JSON.parse(Buffer.from(token.split(".")[1], "base64url").toString("utf8"));
            if (iss !== "https://token.actions.githubusercontent.com" || aud !== "api://AzureADTokenExchange" || typeof sub !== "string") {
              throw new Error("Unexpected OIDC claims; no token or claims were logged.");
            }
            await core.summary
              .addHeading("Copy these actual claims into the Azure federated identity credential")
              .addCodeBlock(JSON.stringify({ iss, aud, sub }, null, 2), "json")
              .write();
