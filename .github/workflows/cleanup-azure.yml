name: Cleanup Azure lab

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: "Type the exact dedicated AZURE_RESOURCE_GROUP to permanently delete (including all photos and databases)."
        required: true
        type: string
      acknowledge_deletion:
        description: "I approve permanent deletion of this tagged lab resource group and all its data."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: azure
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.acknowledge_deletion
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: azure
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      AZURE_DELETE_ACKNOWLEDGED: ${{ inputs.acknowledge_deletion }}
      AZURE_DELETE_RESOURCE_GROUP: ${{ inputs.resource_group }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Require explicit acknowledgement and an exact lab resource-group match before login
        run: node scripts/azure-cleanup.mjs validate
      - name: Require protected-environment settings before Azure access
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { requireProtectedEnvironment } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/azure-lib.mjs`);
            const environment = await github.rest.repos.getEnvironment({ ...context.repo, environment_name: "azure" });
            const policies = await github.paginate(github.rest.repos.listDeploymentBranchPolicies, { ...context.repo, environment_name: "azure", per_page: 100 });
            requireProtectedEnvironment(environment.data, policies, context.payload.repository.default_branch);
      - uses: azure/login@8c334a195cbb38e46038007b304988d888bf676a # GitHub Azure OIDC documentation pin
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify ownership tags, delete only the confirmed lab, and verify it no longer exists
        run: node scripts/azure-cleanup.mjs delete
