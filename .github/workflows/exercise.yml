name: Exercise coach

on:
  push:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [CI, Deploy to Azure]
    types: [completed]
  workflow_dispatch:
    inputs:
      preview:
        description: Preview the coach in a template repository
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: exercise-coach
  cancel-in-progress: false

jobs:
  coach:
    if: >-
      github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request && github.event.comment.body == '/check')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Read only the trusted default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Initialize or check the exercise
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const exercise = require('./.github/scripts/exercise.cjs');
            await exercise({ github, context, core });
