name: Codespaces image

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/codespaces.yml"
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/codespaces.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codespaces-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and exercise the development container without publishing it
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          push: never
          inheritEnv: false
          env: GH_TOKEN
          runCmd: |
            npm run lab -- doctor
            az version --output json
            docker info --format '{{.ServerVersion}}'
            gh aw --version
            npm run verify
            npm run lab -- test both
